name: Daily V2EX Digest

on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 CST (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-dotenv httpx

      - name: Run analyzer
        run: python run.py

      - name: Prepare publish dir
        run: mkdir -p dist && cp index.html dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
